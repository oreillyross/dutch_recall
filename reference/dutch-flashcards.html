<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dutch Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ee;
    --surface: #fffdf9;
    --ink: #1f1d1a;
    --muted: #6f6a62;
    --line: #e4ded3;
    --accent: #e8590c;
    --accent-ink: #ffffff;
    --accent-soft: #fdeee3;
    --back: #1f2a37;
    --back-ink: #f3efe8;
    --back-muted: #a9b2bd;
    --back-line: #324152;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413;
      --surface: #1e1c1a;
      --ink: #f1ece4;
      --muted: #9c958a;
      --line: #2e2b28;
      --accent: #ff7a2f;
      --accent-ink: #1a1208;
      --accent-soft: #2c1f15;
      --back: #101820;
      --back-line: #26333f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  nav { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  nav button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 500;
    padding: 7px 16px; border-radius: 999px; cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  nav button:focus-visible, .btn:focus-visible, textarea:focus-visible, .card-front:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel[hidden] { display: none; }

  /* Settings */
  .settings label.title { display: block; font-weight: 600; margin-bottom: 4px; }
  .settings p.help { margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  textarea {
    width: 100%; min-height: 300px; resize: vertical; padding: 14px 16px; font: inherit; font-size: 16px; line-height: 1.55;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
  }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .row .spacer { flex: 1; }
  .count { color: var(--muted); font-size: 14px; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .btn {
    font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border-radius: 12px; padding: 11px 20px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.ghost { color: var(--muted); font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: default; }

  /* Cards */
  .progress { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; color: var(--muted); font-size: 14px; }
  .bar { flex: 1; height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  .scene { perspective: 1400px; height: min(66vh, 540px); min-height: 380px; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,.7,.2,1); }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: var(--radius); backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 1px solid var(--line); overflow: hidden;
  }
  .card-front {
    background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 28px; cursor: pointer; box-shadow: 0 1px 0 var(--line), 0 14px 34px -22px rgba(0,0,0,.35);
  }
  .tag { position: absolute; top: 18px; left: 20px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .word { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(34px, 8vw, 60px); line-height: 1.15; letter-spacing: -0.015em; overflow-wrap: anywhere; }
  .word.long { font-size: clamp(24px, 5vw, 34px); line-height: 1.3; }
  .hint { position: absolute; bottom: 20px; font-size: 13px; color: var(--muted); }

  .card-back {
    transform: rotateY(180deg); background: var(--back); color: var(--back-ink); border-color: var(--back-line);
    overflow-y: auto; padding: 26px 26px 30px; text-align: left;
  }
  .card-back .tag { position: static; display: block; color: var(--back-muted); margin-bottom: 6px; }
  .back-nl { font-family: Fraunces, Georgia, serif; color: var(--back-muted); font-size: 16px; margin-bottom: 2px; }
  .back-en { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(28px, 6vw, 40px); line-height: 1.15; letter-spacing: -0.01em; }
  .alts { color: var(--back-muted); font-size: 15px; margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.08); color: var(--back-ink); }
  .chip.hi { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .sec { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--back-line); }
  .sec h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--back-muted); font-weight: 600; }
  .sec p { margin: 0; line-height: 1.6; font-size: 15px; }
  .ex { margin: 0 0 10px; }
  .ex .nl { font-weight: 500; font-size: 15.5px; line-height: 1.45; }
  .ex .en { color: var(--back-muted); font-size: 14px; margin-top: 1px; }
  .rel { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14.5px; }
  .rel b { font-weight: 500; }
  .rel span { color: var(--back-muted); }
  .loading { display: flex; align-items: center; gap: 12px; margin-top: 18px; color: var(--back-muted); font-size: 15px; }
  .spin { width: 18px; height: 18px; border: 2px solid var(--back-line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.07); font-size: 14.5px; line-height: 1.5; }
  .err button { margin-top: 10px; }
  .btn.small { padding: 7px 14px; font-size: 14px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .controls { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
  .controls .btn { min-width: 110px; }
  .kbd { text-align: center; margin-top: 12px; font-size: 12.5px; color: var(--muted); }

  .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
  .empty h2 { font-family: Fraunces, Georgia, serif; color: var(--ink); margin: 0 0 8px; }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .spin { animation-duration: 2s; } }
  @media (max-width: 520px) { .kbd { display: none; } .controls .btn { min-width: 0; flex: 1; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Nederlands <span>kaartjes</span></h1>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" id="tab-cards" aria-selected="true" aria-controls="panel-cards">Cards</button>
      <button role="tab" id="tab-settings" aria-selected="false" aria-controls="panel-settings">Settings</button>
    </nav>
  </header>

  <!-- Cards -->
  <section class="panel" id="panel-cards" role="tabpanel" aria-labelledby="tab-cards">
    <div id="deck">
      <div class="progress"><span id="pos">0 / 0</span><div class="bar"><i id="barfill"></i></div></div>
      <div class="scene">
        <div class="card" id="card">
          <div class="face card-front" id="front" tabindex="0" role="button" aria-label="Flip card">
            <span class="tag">Nederlands</span>
            <div class="word" id="word"></div>
            <span class="hint">Guess the English, then tap to flip</span>
          </div>
          <div class="face card-back" id="back" aria-live="polite"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="prev">← Prev</button>
        <button class="btn primary" id="flip">Flip</button>
        <button class="btn" id="next">Next →</button>
      </div>
      <div class="kbd">Space flips · ← → moves between cards</div>
    </div>
    <div class="empty" id="empty" hidden>
      <h2>No words yet</h2>
      <p>Paste some Dutch words or phrases in Settings.</p>
      <button class="btn primary" id="goSettings">Open Settings</button>
    </div>
  </section>

  <!-- Settings -->
  <section class="panel settings" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <label class="title" for="words">Your Dutch words</label>
    <p class="help">One word or phrase per line. Duplicates and blank lines are ignored. Saving refreshes the flashcards.</p>
    <textarea id="words" spellcheck="false" placeholder="gezellig&#10;aan de slag gaan&#10;uitzoeken&#10;de fiets&#10;het is niet mijn pakkie-an"></textarea>
    <div class="row">
      <span class="count" id="count">0 words</span>
      <label class="check"><input type="checkbox" id="shuffle" checked> Shuffle order</label>
      <span class="spacer"></span>
      <button class="btn ghost" id="clear">Clear</button>
      <button class="btn primary" id="save">Save &amp; refresh cards</button>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  // ---------- storage (best-effort; page works without it) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- state ----------
  let raw = store.get('nl.raw', '');
  let shuffleOn = store.get('nl.shuffle', true);
  let deck = store.get('nl.deck', []);
  let index = Math.min(store.get('nl.index', 0), Math.max(deck.length - 1, 0));
  let insights = store.get('nl.insights', {});
  let flipped = false;
  let reqId = 0;

  // ---------- elements ----------
  const $ = id => document.getElementById(id);
  const tabCards = $('tab-cards'), tabSettings = $('tab-settings');
  const panelCards = $('panel-cards'), panelSettings = $('panel-settings');
  const ta = $('words'), countEl = $('count'), shuffleEl = $('shuffle');
  const card = $('card'), wordEl = $('word'), backEl = $('back');

  // ---------- helpers ----------
  function parseWords(text) {
    const seen = new Set(), out = [];
    for (const line of text.split(/\r?\n/)) {
      const w = line.trim().replace(/\s+/g, ' ');
      if (!w) continue;
      const key = w.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key); out.push(w);
    }
    return out;
  }
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ---------- tabs ----------
  function showTab(name) {
    const cards = name === 'cards';
    tabCards.setAttribute('aria-selected', cards);
    tabSettings.setAttribute('aria-selected', !cards);
    panelCards.hidden = !cards;
    panelSettings.hidden = cards;
    if (!cards) ta.focus({ preventScroll: true });
  }
  tabCards.onclick = () => showTab('cards');
  tabSettings.onclick = () => showTab('settings');
  $('goSettings').onclick = () => showTab('settings');

  // ---------- settings ----------
  function updateCount() {
    const n = parseWords(ta.value).length;
    countEl.textContent = n + (n === 1 ? ' word' : ' words');
  }
  ta.addEventListener('input', updateCount);
  $('clear').onclick = () => { ta.value = ''; updateCount(); ta.focus(); };
  $('save').onclick = () => {
    raw = ta.value;
    shuffleOn = shuffleEl.checked;
    const list = parseWords(raw);
    deck = shuffleOn ? shuffled(list) : list;
    index = 0;
    store.set('nl.raw', raw); store.set('nl.shuffle', shuffleOn);
    store.set('nl.deck', deck); store.set('nl.index', 0);
    renderCard();
    showTab('cards');
  };

  // ---------- card rendering ----------
  function setFlipped(f) {
    flipped = f;
    card.classList.toggle('flipped', f);
    $('flip').textContent = f ? 'Flip back' : 'Flip';
  }

  function renderCard() {
    const has = deck.length > 0;
    $('deck').hidden = !has;
    $('empty').hidden = has;
    if (!has) return;
    reqId++;
    setFlipped(false);
    const w = deck[index];
    wordEl.textContent = w;
    wordEl.classList.toggle('long', w.length > 22 || w.split(' ').length > 3);
    $('pos').textContent = (index + 1) + ' / ' + deck.length;
    $('barfill').style.width = ((index + 1) / deck.length * 100) + '%';
    $('prev').disabled = index === 0;
    $('next').disabled = index === deck.length - 1;
    store.set('nl.index', index);
    backEl.scrollTop = 0;
    renderBack(null);
  }

  function renderBack(state, data, msg) {
    backEl.textContent = '';
    const w = deck[index];
    backEl.appendChild(el('span', 'tag', 'English'));
    backEl.appendChild(el('div', 'back-nl', w));

    const cached = insights[w.toLowerCase()];
    if (!state && cached) { state = 'ok'; data = cached; }

    if (state === 'loading') {
      const l = el('div', 'loading'); l.appendChild(el('div', 'spin')); l.appendChild(el('span', null, 'Looking it up…'));
      backEl.appendChild(l);
      return;
    }
    if (state === 'error') {
      const e = el('div', 'err', msg || 'Could not load the insight.');
      const b = el('button', 'btn small', 'Try again');
      b.onclick = () => loadInsight(true);
      e.appendChild(el('br')); e.appendChild(b);
      backEl.appendChild(e);
      return;
    }
    if (state !== 'ok' || !data) return;

    const eng = Array.isArray(data.english) ? data.english : [String(data.english || '')];
    backEl.appendChild(el('div', 'back-en', eng[0] || '—'));
    if (eng.length > 1) backEl.appendChild(el('div', 'alts', 'also: ' + eng.slice(1).join(' · ')));

    const chips = el('div', 'chips');
    if (data.pos) chips.appendChild(el('span', 'chip hi', data.pos));
    if (data.forms) chips.appendChild(el('span', 'chip', data.forms));
    if (data.pronunciation) chips.appendChild(el('span', 'chip', '🔊 ' + data.pronunciation));
    if (chips.children.length) backEl.appendChild(chips);

    if (Array.isArray(data.examples) && data.examples.length) {
      const s = el('div', 'sec'); s.appendChild(el('h3', null, 'In use'));
      data.examples.forEach(x => {
        const d = el('div', 'ex');
        d.appendChild(el('div', 'nl', x.nl || ''));
        d.appendChild(el('div', 'en', x.en || ''));
        s.appendChild(d);
      });
      backEl.appendChild(s);
    }
    if (data.notes) {
      const s = el('div', 'sec'); s.appendChild(el('h3', null, 'Good to know'));
      s.appendChild(el('p', null, data.notes));
      backEl.appendChild(s);
    }
    if (Array.isArray(data.related) && data.related.length) {
      const s = el('div', 'sec'); s.appendChild(el('h3', null, 'Related'));
      const g = el('div', 'rel');
      data.related.forEach(r => { g.appendChild(el('b', null, r.nl || '')); g.appendChild(el('span', null, r.en || '')); });
      s.appendChild(g);
      backEl.appendChild(s);
    }
  }

  // ---------- insight via Claude ----------
  function buildPrompt(entry) {
    return [
      'You are a concise Dutch tutor helping an English speaker learn Dutch.',
      'The learner pasted this Dutch word or phrase: "' + entry + '"',
      '',
      'Reply with ONLY a JSON object (no markdown, no code fences) with these keys:',
      '{',
      '  "english": ["best natural English translation", "up to 2 alternative meanings if genuinely distinct"],',
      '  "pos": "part of speech; for nouns include article, e.g. \\"noun · de\\" or \\"noun · het\\"; for idioms say \\"idiom\\" or \\"phrase\\"",',
      '  "forms": "key forms the learner needs: noun plural and diminutive; verb infinitive, past singular and past participle (mark separable verbs); adjective comparative. Short. Empty string if not useful",',
      '  "pronunciation": "short respelling hint only if the word has tricky sounds (ui, g, ij, eu); otherwise empty string",',
      '  "examples": [{"nl": "natural Dutch sentence using it", "en": "English translation"}],  // exactly 2, everyday and short',
      '  "notes": "2-4 sentences: nuance, register, common mistakes, false friends, literal meaning for idioms, a memory hook or etymology link to English/German if it genuinely helps",',
      '  "related": [{"nl": "related word or common collocation", "en": "meaning"}]  // 2-4 items',
      '}',
      '',
      'If the input is a full phrase or sentence, translate it naturally, explain any idiom, and in "notes" break down the key words. Keep everything compact.'
    ].join('\n');
  }

  function parseJSON(text) {
    const s = text.indexOf('{'), e = text.lastIndexOf('}');
    if (s === -1 || e === -1) throw new Error('No JSON in reply');
    return JSON.parse(text.slice(s, e + 1));
  }

  async function loadInsight(force) {
    const w = deck[index];
    const key = w.toLowerCase();
    if (!force && insights[key]) { renderBack('ok', insights[key]); return; }
    const my = ++reqId;
    renderBack('loading');
    try {
      const sample = await window.claude.use('sample');
      if (!sample) throw { code: 'unavailable' };
      const res = await sample(buildPrompt(w), { modelTier: 'quick', cache: !force });
      const data = parseJSON(res.text);
      insights[key] = data;
      store.set('nl.insights', insights);
      if (my === reqId) renderBack('ok', data);
    } catch (err) {
      if (my !== reqId) return;
      let msg = 'Could not load the insight. Try again.';
      if (err && err.code === 'unavailable') msg = 'Insights need Claude, which is not available in this view. Open the artifact on claude.ai.';
      else if (err && err.code === 'not_granted') msg = 'Claude access was not granted for this page, so no insight can be shown.';
      else if (err && err.code === 'rate_limited') msg = 'Too many requests. Wait a moment, then try again.';
      renderBack('error', null, msg);
    }
  }

  // ---------- actions ----------
  function flip() {
    if (!deck.length) return;
    if (!flipped) { setFlipped(true); loadInsight(false); }
    else { setFlipped(false); }
  }
  function go(delta) {
    const n = index + delta;
    if (n < 0 || n >= deck.length) return;
    index = n;
    renderCard();
  }

  $('flip').onclick = flip;
  $('prev').onclick = () => go(-1);
  $('next').onclick = () => go(1);
  $('front').onclick = flip;
  $('front').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); flip(); } });

  document.addEventListener('keydown', e => {
    if (panelCards.hidden) return;
    const t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return;
    if (e.key === ' ' && !(t && t.tagName === 'BUTTON')) { e.preventDefault(); flip(); }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  // ---------- init ----------
  ta.value = raw;
  shuffleEl.checked = shuffleOn;
  updateCount();
  renderCard();
  if (!deck.length) showTab('settings');
})();
</script>
</body>
</html>
